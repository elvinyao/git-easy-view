{% extends 'base.html' %}
{% import 'form_fields.html' as f with context %}
{% block content %}
  <p class="eyebrow">
    <a href="/admin">{{ t('管理工作台') }}</a> / {{ t('项目信息') }}
  </p>
  <h1>{{ project.name }}</h1>
  <div class="admin-grid">
    <section class="panel">
      <h2>{{ t('项目信息') }}</h2>
      <form method="post" action="/admin/projects/{{ project.id }}" class="stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
          {{ t('名称') }}
          <input name="name" {{ f.attrs('name') }} value="{{ f.value('name', project.name) }}" maxlength="255" required>
        </label>
        <label>
          {{ t('描述') }}<textarea name="description" {{ f.attrs('description') }} maxlength="4000">{{ f.value('description', project.description or '') }}</textarea>
        </label>
        <button>{{ t('保存项目') }}</button>
      </form>
    </section>
  </div>
{% endblock %}
