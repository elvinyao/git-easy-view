{% extends 'base.html' %}
{% import 'form_fields.html' as f with context %}
{% block content %}
  <p class="eyebrow">
    <a href="/admin">{{ t('管理工作台') }}</a> {{ t('/ 用户') }}
  </p>
  <h1>{{ t('编辑用户') if person else t('创建用户') }}</h1>
  <section class="panel detail-section">
    <form method="post"
          action="{{ '/admin/users/' ~ person.id if person else '/admin/users' }}"
          class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        {{ t('用户名') }}
        <input name="username"
               {{ f.attrs('username') }} value="{{ f.value('username', person.username if person else '') }}"
               required
               maxlength="150"
               autocomplete="off">
      </label>
      <label>
        {{ t('新密码（留空保留原密码）') if person else t('密码') }}
        <input name="password"
               {{ f.attrs('password') }}
               type="password"
               minlength="12"
               maxlength="1024"
               autocomplete="new-password"
               {% if not person %}required{% endif %}>
      </label>
      <p class="help">{{ t('密码至少 12 个字符。') }}</p>
      <div class="check-row">
        <label>
          <input type="checkbox"
                 name="is_admin"
                 {{ f.attrs('is_admin') }} {{ f.checked('is_admin', person and person.is_admin) }}>
          {{ t('系统管理员') }}
        </label>
        {% if person %}
          <label>
            <input type="checkbox"
                   name="is_active"
                   {{ f.attrs('is_active') }} {{ f.checked('is_active', person.is_active) }}>
            {{ t('启用账号') }}
          </label>
        {% endif %}
      </div>
      <button class="primary">{{ t('保存用户') }}</button>
    </form>
  </section>
{% endblock %}
