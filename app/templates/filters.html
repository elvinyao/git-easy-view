<form method="get" class="filters">
  <input type="hidden" name="lang" value="{{ locale }}">
  {% if query.density == 'compact' %}<input type="hidden" name="density" value="compact">{% endif %}
  <label class="search">
    {{ t('分支名称') }}
    <input type="search"
           name="q"
           value="{{ query.q }}"
           placeholder="{{ t('搜索分支，如 feature/login') }}">
  </label>
  <label>
    {{ t('分支角色') }}
    <select name="role">
      <option value="">{{ t('全部角色') }}</option>
      {% for key, label in roles.items() %}
        <option value="{{ key }}" {% if query.role == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    {{ t('当前提交关系') }}
    <select name="relation">
      <option value="">{{ t('全部关系') }}</option>
      {% for key, label in states.items() %}
        <option value="{{ key }}" {% if query.relation == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <input type="hidden"
         name="expanded"
         value="{{ query.expanded|sort|join(',') }}">
  {% for key, value in query.branch_pages.items() %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
  {% endfor %}
  <button type="submit">{{ t('应用筛选') }}</button>
  <a class="muted" href="?">{{ t('重置') }}</a>
</form>
