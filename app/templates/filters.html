<form method="get" class="filters">
  <label class="search">
    分支名称
    <input type="search"
           name="q"
           value="{{ query.q }}"
           placeholder="搜索分支，如 feature/login">
  </label>
  <label>
    分支角色
    <select name="role">
      <option value="">全部角色</option>
      {% for key, label in roles.items() %}
        <option value="{{ key }}" {% if query.role == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    当前提交关系
    <select name="relation">
      <option value="">全部关系</option>
      {% for key, label in states.items() %}
        <option value="{{ key }}" {% if query.relation == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <input type="hidden"
         name="expanded"
         value="{{ query.expanded|sort|join(',') }}">
  {% for key, value in query.branch_pages.items() %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
  {% endfor %}
  <button type="submit">应用筛选</button>
  <a class="muted" href="?">重置</a>
</form>
