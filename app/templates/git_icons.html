{% macro icon(name) -%}
<svg class="git-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'branch' %}<circle cx="5" cy="4" r="2"/><circle cx="5" cy="16" r="2"/><circle cx="15" cy="5" r="2"/><path d="M5 6v8m10-7c0 4-10 3-10 7"/>
  {% elif name == 'commit' %}<circle cx="10" cy="10" r="3.5"/><path d="M2 10h4m8 0h4"/>
  {% elif name == 'folder' %}<path d="M2 5h6l2 2h8v9H2z"/>
  {% elif name == 'search' %}<circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/>
  {% elif name == 'refresh' %}<path d="M16.5 8A7 7 0 1 0 17 12M17 3v5h-5"/>
  {% elif name == 'copy' %}<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 3H5a2 2 0 0 0-2 2v7"/>
  {% elif name == 'file' %}<path d="M4 2h8l4 4v12H4zM12 2v5h4"/>
  {% elif name == 'back' %}<path d="m8 4-6 6 6 6M2 10h15"/>
  {% elif name == 'collapse' %}<path d="m5 6 5-4 5 4m-10 8 5 4 5-4"/>
  {% elif name == 'arrow' %}<path d="M3 10h13m-5-5 5 5-5 5"/>
  {% elif name == 'chevron' %}<path d="m7 4 6 6-6 6"/>
  {% endif %}
</svg>
{%- endmacro %}
