<!DOCTYPE html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('登录 · Git Easy View') }}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body class="login-body">
    <main class="login-card">
      <span class="brand-mark">g.</span>
      <p class="eyebrow">GIT EASY VIEW</p>
      <h1>{{ t('看清每条分支的进展') }}</h1>
      <p class="muted">{{ t('项目和分支可匿名查看。管理连接与配置时，请使用管理员账号登录。') }}</p>
      {% if error %}<p class="notice danger" role="alert">{{ t('用户名或密码不正确，请重试。') }}</p>{% endif %}
      <form method="post" action="/login" class="stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>
          {{ t('用户名') }}
          <input name="username" value="{{ username|default('') }}" autocomplete="username" required>
        </label>
        <label>
          {{ t('密码') }}
          <input name="password"
                 type="password"
                 autocomplete="current-password"
                 required>
        </label>
        <button type="submit" class="primary">{{ t('登录工作台 →') }}</button>
      </form>
      <a class="button login-browse" href="/">{{ t('匿名浏览项目 →') }}</a>
      {% include 'language_picker.html' %}
    </main>
  </body>
</html>
