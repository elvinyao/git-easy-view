x-app: &app
  build: .
  image: ${GEV_APP_IMAGE:-git-easy-view:local}
  env_file: ${GEV_ENV_FILE:-./runtime/local.env}
  volumes:
    - app-data:/data/db
    - git-cache:/data/git
    - ./runtime/ca:/etc/gev/ca:ro
  restart: unless-stopped

services:
  postgres:
    profiles: [legacy]
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: gev
      POSTGRES_DB: gev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacy-not-configured}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gev -d gev']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    profiles: [legacy]
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    profiles: [tools]
    command: [alembic, upgrade, head]
    restart: 'no'
  web:
    <<: *app
    init: true
    stop_grace_period: 30s
    ports: ['127.0.0.1:${GEV_PORT:-8766}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    profiles: [legacy]
    command: [sh, -c, 'exec rq worker --with-scheduler --name "$$HOSTNAME" --url "$$GEV_REDIS_URL" "$${GEV_QUEUE_NAME:-git-sync}"']
    deploy: {replicas: 2}
    healthcheck:
      test: [CMD, python, -c, "import os,socket; from redis import Redis; r=Redis.from_url(os.environ['GEV_REDIS_URL'],socket_timeout=3); assert r.exists('rq:worker:'+socket.gethostname())"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  dispatcher:
    <<: *app
    profiles: [legacy]
    command: [python, -m, app.scheduler]
    healthcheck:
      test: [CMD, python, -c, "from app.config import Settings; from app.db import make_engine; from sqlalchemy import text; from redis import Redis; s=Settings(); c=make_engine(s.database_url).connect(); c.execute(text('SELECT 1')); Redis.from_url(s.redis_url,socket_timeout=3).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
  tools:
    <<: *app
    profiles: [tools]
    restart: 'no'
    volumes:
      - .:/workspace
      - app-data:/data/db
      - git-cache:/data/git
      - ./runtime/ca:/etc/gev/ca:ro
  browser:
    <<: *app
    profiles: [verification]
    image: git-easy-view:browser
    build:
      context: .
      dockerfile: .agent/Dockerfile.browser
    restart: 'no'
    shm_size: 1gb
    volumes:
      - .:/workspace
      - app-data:/data/db
      - git-cache:/data/git
  integration:
    <<: *app
    profiles: [verification]
    image: git-easy-view:integration
    build:
      context: .
      dockerfile: .agent/Dockerfile.integration
    restart: 'no'
    volumes:
      - .:/workspace

volumes:
  app-data:
  postgres-data:
  redis-data:
  git-cache:
