x-app: &app
  image: ${GEV_INTRANET_IMAGE:?Run bash deploy/deploy.sh first}
  build:
    context: .
    dockerfile: deploy/Dockerfile
    args:
      GEV_CA_FINGERPRINT: ${GEV_CA_FINGERPRINT:?Run bash deploy/deploy.sh first}
    secrets: [build_network, corporate_ca]
    extra_hosts: [host.docker.internal:host-gateway]
  env_file:
    - ${GEV_ENV_FILE:-./runtime/local.env}
    - path: ${GEV_RUNTIME_NETWORK:?Run bash deploy/deploy.sh first}
      format: raw
  extra_hosts: [host.docker.internal:host-gateway]
  environment:
    SSL_CERT_FILE: /tmp/gev-ca-bundle.pem
    REQUESTS_CA_BUNDLE: /tmp/gev-ca-bundle.pem
    PIP_CERT: /tmp/gev-ca-bundle.pem
    CURL_CA_BUNDLE: /tmp/gev-ca-bundle.pem
    GIT_SSL_CAINFO: /tmp/gev-ca-bundle.pem
    GIT_PROXY_SSL_CAINFO: /tmp/gev-ca-bundle.pem
  volumes:
    - app-data:/data/db
    - git-cache:/data/git
    - type: bind
      source: ${GEV_LOCAL_GIT_DIRECTORY:-./runtime/local-repositories}
      target: /data/local-git
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${GEV_CA_DIR:?Run bash deploy/deploy.sh first}
      target: /etc/gev/ca
      read_only: true
      bind:
        create_host_path: false
  restart: unless-stopped

services:
  web:
    <<: *app
    init: true
    stop_grace_period: 30s
    ports: ['${GEV_BIND_ADDRESS:-127.0.0.1}:${GEV_PORT:-8766}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  migrate:
    <<: *app
    profiles: [tools]
    command: [alembic, upgrade, head]
    restart: 'no'
  tools:
    <<: *app
    profiles: [tools]
    volumes:
      - .:/workspace
      - app-data:/data/db
      - git-cache:/data/git
      - type: bind
        source: ${GEV_LOCAL_GIT_DIRECTORY:-./runtime/local-repositories}
        target: /data/local-git
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GEV_CA_DIR:?Run bash deploy/deploy.sh first}
        target: /etc/gev/ca
        read_only: true
        bind:
          create_host_path: false
    restart: 'no'

secrets:
  build_network:
    file: ${GEV_BUILD_NETWORK:?Run bash deploy/deploy.sh first}
  corporate_ca:
    file: ${GEV_BUILD_CA:?Run bash deploy/deploy.sh first}
volumes:
  app-data:
  git-cache:
