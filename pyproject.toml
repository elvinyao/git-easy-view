[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "git-easy-view"
version = "0.1.0"
description = "Team Git branch and repository dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
  "argon2-cffi>=23,<26",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "rq>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gev = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
